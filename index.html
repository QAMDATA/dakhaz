<!doctype html>
<html lang="ckb" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dakhaz Parts</title>
<meta name="theme-color" content="#1638b8">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>html,body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}img{max-width:100%}[hidden]{display:none!important}</style>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;700;900&display=swap">
<style>
/* Layout: sticky branded header + scrollable tabs, content as stacked cards; RTL for Kurdish/Arabic, LTR for English */
:root{
  --bg:#f1f4fb; --map:#e8eef8; --mapline:#d6dfee; --surface:#ffffff; --line:#dbe2f0; --ink:#0f1a3a; --muted:#56618a;
  --brand:#1638b8; --brand2:#1e6bff; --accent-soft:#e2eaff; --tag:#1e6bff; --tag-soft:#e2ecff;
  --ok:#17834a; --ok-soft:#daf1e3; --warn:#a96e12; --warn-soft:#faefd6; --bad:#c2352b; --bad-soft:#fbe2df;
  --font:"Vazirmatn",system-ui,"Segoe UI",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0b1020; --map:#111a2e; --mapline:#1d2842; --surface:#131a30; --line:#26304d; --ink:#e7ecfa; --muted:#98a3c4;
  --brand:#5a82ff; --brand2:#6f9bff; --accent-soft:#1a2550; --tag:#7ea6ff; --tag-soft:#18254d;
  --ok:#4fca86; --ok-soft:#12301f; --warn:#e8b65a; --warn-soft:#352a12; --bad:#f07a70; --bad-soft:#3a1916; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0b1020; --map:#111a2e; --mapline:#1d2842; --surface:#131a30; --line:#26304d; --ink:#e7ecfa; --muted:#98a3c4;
  --brand:#5a82ff; --brand2:#6f9bff; --accent-soft:#1a2550; --tag:#7ea6ff; --tag-soft:#18254d;
  --ok:#4fca86; --ok-soft:#12301f; --warn:#e8b65a; --warn-soft:#352a12; --bad:#f07a70; --bad-soft:#3a1916; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6}
*{box-sizing:border-box}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
.wrap{max-width:1000px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.num{font-variant-numeric:tabular-nums;direction:ltr;unicode-bidi:isolate}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand2);outline-offset:2px}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.3}

header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:10px;padding-block:10px}
.mark{width:40px;height:40px;border-radius:10px;background:#fff;border:1px solid var(--line);flex:none;object-fit:contain;padding:3px}
.hname{flex:1;min-width:0}
.hname b{display:block;font-size:16px;font-weight:900;letter-spacing:.2px}
.hname small{color:var(--muted);font-size:12.5px}
.tabs{display:flex;flex-wrap:wrap;gap:4px;padding-bottom:8px}
.tabs::-webkit-scrollbar{display:none}
.tab{border:0;background:none;padding:7px 14px;border-radius:999px;color:var(--muted);font-weight:500;white-space:nowrap;display:flex;gap:6px;align-items:center}
.tab.on{background:var(--accent-soft);color:var(--brand);font-weight:700}
.badge{background:var(--brand2);color:#fff;border-radius:999px;font-size:11px;min-width:18px;height:18px;display:inline-grid;place-items:center;padding:0 5px}
.lang{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex:none}
.lang button{border:0;background:none;padding:5px 9px;font-size:12.5px;font-weight:700;color:var(--muted)}
.lang button.on{background:var(--brand);color:#fff}

main{padding-block:18px 60px;display:flex;flex-direction:column;gap:16px}
.sec-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sec-head h2{font-size:19px;flex:1}

.btn{border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;font-weight:500;display:inline-flex;gap:6px;align-items:center;justify-content:center}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 10px;font-size:13.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:13px;color:var(--muted);font-weight:500}
.inp{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 12px;width:100%}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.search{flex:1 1 200px}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:720px){.stats{grid-template-columns:repeat(2,1fr)}}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px}
.stat small{color:var(--muted);font-size:12.5px;display:block}
.stat b{font-size:22px;font-weight:900;display:block;margin-top:2px}
.stat.hl{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff}
.stat.hl small{color:rgba(255,255,255,.85)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.panel-h{padding:12px 14px;border-bottom:1px solid var(--line);font-weight:700;display:flex;justify-content:space-between;gap:8px}
.row{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .grow{flex:1;min-width:0}
.row .sub{color:var(--muted);font-size:13px}
.empty{padding:28px 14px;text-align:center;color:var(--muted)}

.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 12px;font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;white-space:nowrap}
.p-new{background:var(--tag-soft);color:var(--tag)}
.p-approved{background:var(--accent-soft);color:var(--brand)}
.p-ready,.p-assigned{background:var(--accent-soft);color:var(--brand)}
.p-handed{background:var(--tag-soft);color:var(--tag)}
.p-shipping{background:var(--warn-soft);color:var(--warn)}
.p-delivered{background:var(--ok-soft);color:var(--ok)}
.p-rejected{background:var(--bad-soft);color:var(--bad)}

.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.pcard .top{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.pcard .top>div:first-child{min-width:0}
.pcard h3{font-size:15px;overflow-wrap:anywhere}
.cat{font-size:12px;color:var(--brand);font-weight:500}
.price{font-size:19px;font-weight:900;white-space:nowrap}
.kv{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;font-size:12.5px;color:var(--muted)}
.kv b{display:block;color:var(--ink);font-size:15px}
.low b{color:var(--bad)}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:32px;height:32px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700}

.ocard{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.ocard .oh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ocard .oh b{flex:1}
.items{font-size:13.5px;border-top:1px dashed var(--line);padding-top:8px;display:flex;flex-direction:column;gap:3px}
.items div{display:flex;justify-content:space-between;gap:8px}
.total{display:flex;justify-content:space-between;font-weight:700}
.bar{height:6px;background:var(--bg);border-radius:9px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok)}

.login{display:grid;place-items:center;padding-block:28px}
.lcard{width:100%;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:22px;display:flex;flex-direction:column;gap:14px}
.logo-box{background:#fff;border-radius:14px;padding:8px;display:flex;justify-content:center}
.logo-box img{width:100%;max-width:320px}
.lphone{display:flex;justify-content:center;gap:6px;font-weight:700;color:var(--brand)}
.lock{font-size:13px;color:var(--muted);background:var(--bg);border-radius:10px;padding:10px 12px}
.demo{font-size:13px;border:1px dashed var(--line);border-radius:10px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.err{color:var(--bad);font-size:13.5px;min-height:1em}

.ov{position:fixed;inset:0;background:rgba(8,14,34,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:600px){.ov{align-items:center}}
.md{background:var(--surface);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:20px max(20px,env(safe-area-inset-left,0px)) calc(20px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:90vh;overflow:auto}
@media(min-width:600px){.md{border-radius:18px}}
.md-f{display:flex;gap:8px;margin-top:4px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;z-index:30;font-size:14px;max-width:90vw;text-align:center}
.cartbar{position:sticky;bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--brand);color:#fff;border-radius:14px;padding:12px 16px;display:flex;align-items:center;gap:12px}
.cartbar b{flex:1}
.cartbar .btn{background:#fff;color:var(--brand);border:0}
.av{border-radius:12px;object-fit:cover;background:#fff;border:1px solid var(--line);flex:none;display:inline-grid;place-items:center}
.av.ph{background:var(--accent-soft);color:var(--brand);font-weight:900;border:0}
.prof{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.prof .grow{flex:1;min-width:160px}
.pbody{padding:14px;display:flex;flex-direction:column;gap:12px}
.maplink{display:inline-flex;align-items:center;gap:4px;color:var(--brand);font-weight:700;text-decoration:none}
.mapbox{position:relative;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:var(--map)}
.mapbox svg{display:block;width:100%;height:auto;touch-action:manipulation}
.mbg{fill:var(--map)}.mg{stroke:var(--mapline);stroke-width:1}
.mc{fill:var(--muted)}.mt{fill:var(--muted);font:500 13px var(--font);text-anchor:middle;paint-order:stroke;stroke:var(--map);stroke-width:4px}
.msb{fill:var(--muted)}
.mp{fill:var(--brand);stroke:#fff;stroke-width:2}
.mpl{fill:#fff;font:900 15px var(--font);text-anchor:middle}
.mpn{fill:var(--ink);font:700 13px var(--font);text-anchor:middle;paint-order:stroke;stroke:var(--map);stroke-width:4px}
.mzoom{position:absolute;top:10px;inset-inline-start:10px;display:flex;flex-direction:column;gap:4px}
.mzoom button{width:34px;height:34px;border-radius:9px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:17px}
.pimg{width:100%;aspect-ratio:4/3;max-width:100%;object-fit:contain;background:#fff;border-radius:10px;border:1px solid var(--line);cursor:zoom-in}
.pimg.ph{cursor:default;background:var(--bg);color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:12px;border-style:dashed}
.thumb{width:44px;height:44px;border-radius:8px;object-fit:contain;background:#fff;border:1px solid var(--line);flex:none;cursor:zoom-in}
.thumb.ph{background:var(--bg);color:var(--muted);display:grid;place-items:center;cursor:default}.thumb.ph svg{width:20px;height:20px}
.flabel{font-size:13px;color:var(--muted);font-weight:500}
.picker{display:flex;gap:12px;align-items:center}
.pprev{width:110px;height:110px;border-radius:12px;border:1px dashed var(--line);background:#fff;display:grid;place-items:center;flex:none;overflow:hidden;text-align:center}
.pprev img{width:100%;height:100%;object-fit:contain}
.pick-acts{display:flex;flex-direction:column;gap:6px;align-items:flex-start;min-width:0}
.imgv{align-items:center;padding:16px;cursor:zoom-out}
.imgv figure{margin:0;max-width:520px;width:100%;background:#fff;border-radius:16px;padding:10px}
.imgv img{width:100%;max-height:70vh;object-fit:contain;display:block}
.imgv figcaption{color:#0f1a3a;font-weight:700;text-align:center;padding-top:8px}
.md.wide{max-width:680px}
.tscroll{overflow-x:auto;max-width:100%}
.dt{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
.dt th{text-align:center;font-size:12px;color:var(--muted);font-weight:700;padding:8px 10px;border-bottom:2px solid var(--line);white-space:nowrap}
.dt td{text-align:center;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.dt .l{text-align:start;white-space:normal;min-width:110px}
.dt .ok,.dsum .ok,.dtot .ok{color:var(--ok)}
.doc{display:flex;flex-direction:column;gap:14px}
.dhead{display:flex;gap:14px;align-items:center;border-bottom:2px solid var(--brand);padding-bottom:12px}
.dlogo{width:120px;flex:none;background:#fff;border-radius:10px;padding:4px}
.dlogo img{width:100%;display:block}
.dtitle{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.dtitle h2{font-size:19px;color:var(--brand)}
.dshop{font-weight:700}
.dsum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.dsum>div{border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.dsum small{display:block;color:var(--muted);font-size:12px}.dsum b{font-size:17px}
.dsum .hl{background:var(--brand);border-color:var(--brand);color:#fff}.dsum .hl small{color:rgba(255,255,255,.85)}
.dtot{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.dtot>div{display:flex;justify-content:space-between;gap:10px;padding:9px 12px;border-bottom:1px solid var(--line)}
.dtot>div:last-child{border-bottom:0}
.dtot .grand{background:var(--brand);color:#fff;font-size:16px}
.sheet{position:fixed;top:0;left:-12000px;width:794px;padding:40px;background:#fff;
  --bg:#f3f6fc;--surface:#fff;--line:#d9e0ee;--ink:#0f1a3a;--muted:#56618a;--brand:#1638b8;--brand2:#1e6bff;--ok:#17834a;--ok-soft:#daf1e3;--warn:#a96e12;--warn-soft:#faefd6;--bad:#c2352b;--bad-soft:#fbe2df;--tag:#1e6bff;--tag-soft:#e2ecff;--accent-soft:#e2eaff;
  color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;letter-spacing:0}
.sheet .tscroll{overflow:visible}.sheet .dt td{white-space:normal}
.paidline{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:13.5px;background:var(--bg);border-radius:10px;padding:8px 10px}
.paidline .ok{color:var(--ok)}
.steps{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;padding-block:4px}
.steps::-webkit-scrollbar{display:none}
.st{flex:1;min-width:46px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);position:relative;text-align:center}
.st i{width:12px;height:12px;border-radius:50%;background:var(--line);display:block;position:relative;z-index:1}
.st::before{content:"";position:absolute;top:5px;inset-inline-start:-50%;width:100%;height:2px;background:var(--line)}
.st:first-child::before{display:none}
.st.done i,.st.cur i{background:var(--brand)}.st.done::before,.st.cur::before{background:var(--brand)}
.st.cur i{box-shadow:0 0 0 4px var(--accent-soft)}.st.cur{color:var(--brand);font-weight:700}
.st small{font-size:10px}
.lmap{height:420px;max-width:100%;border-radius:14px;border:1px solid var(--line);overflow:hidden;z-index:0;background:var(--map)}
.lmap.small{height:300px}
@media(max-width:520px){.lmap{height:360px}}
.lpin{background:none;border:0}
.lpin-b{width:40px;height:40px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--brand);border:2px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35);display:grid;place-items:center;overflow:hidden}
.lpin-b img,.lpin-b span{transform:rotate(45deg)}.lpin-b img{width:30px;height:30px;border-radius:50%;object-fit:cover;background:#fff}
.lpin-b span{color:#fff;font:900 16px var(--font)}
.lpin-n{position:absolute;top:-22px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#fff;color:#0f1a3a;font:700 12px var(--font);padding:1px 7px;border-radius:999px;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.ordiv{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.ordiv::before,.ordiv::after{content:"";flex:1;height:1px;background:var(--line)}
.gbtn{background:#fff;color:#1f1f1f;border:1px solid #dadce0;font-weight:700;gap:10px}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:none;border-radius:9px;padding:9px 6px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--brand);color:#fff}
.cred{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:500 14px/1.7 var(--font);margin:0;overflow-wrap:anywhere}
.note{font-size:12.5px;color:var(--muted)}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding-block:0 30px}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

</head>
<body>
<div id="app"></div>

const COUNTED=['approved','ready','assigned','shipping','handed','delivered'];
const FLOW=[['new','stepNew','ts'],['approved','stepOk','ats'],['ready','stepReady','rts'],['assigned','stepSent','sts'],['shipping','stepWay','dats'],['handed','stepHand','hts'],['delivered','stepDone','dts']];
function acct(sid){
  const bought=db.orders.filter(o=>o.shopId===sid&&COUNTED.includes(o.status)).reduce((s,o)=>s+o.total,0);
  const paid=db.payments.filter(p=>p.shopId===sid).reduce((s,p)=>s+p.amount,0);
  return {bought,paid,rest:Math.max(0,bought-paid)};
}

async function initMaps(){
  const els=[...document.querySelectorAll('[data-lmap]')];if(!els.length)return;
  loadCss(LEAF+'leaflet.min.css');
  try{await loadJs(LEAF+'leaflet.min.js')}catch(e){els.forEach(el=>el.innerHTML=`<div class="empty">${t('netErr')}</div>`);return}
  els.forEach(el=>{if(!el.isConnected||el._map)return;const id=el.dataset.lmap,pick=el.dataset.pick==='1',pts=JSON.parse(el.dataset.pts||'[]');
    const m=L.map(el);el._map=m;
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap'}).addTo(m);
    const icon=p=>L.divIcon({className:'lpin',html:`<div class="lpin-b">${p.logo?`<img src="${p.logo}" alt="">`:`<span>${esc((p.name||'?').charAt(0))}</span>`}</div>${p.name?`<div class="lpin-n">${esc(p.name)}</div>`:''}`,iconSize:[40,46],iconAnchor:[20,46]});
    const mks=pts.map(p=>{const mk=L.marker([p.lat,p.lng],{icon:icon(p)}).addTo(m);if(p.map&&!pick)mk.on('click',()=>window.open(p.map,'_blank','noopener'));return mk});
    const sv=S.mapView[id];
    if(sv)m.setView(sv.c,sv.z);else if(pts.length>1)m.fitBounds(L.latLngBounds(pts.map(p=>[p.lat,p.lng])).pad(0.25));else if(pts.length===1)m.setView([pts[0].lat,pts[0].lng],16);else m.setView([36.867,42.988],12);
    m.on('moveend',()=>{S.mapView[id]={c:m.getCenter(),z:m.getZoom()}});
    if(pick){let mk=mks[0]||null;const me=pts[0]||{name:el.dataset.name,logo:null};
      const set=(lat,lng,zoom)=>{const ll=[lat,lng];if(mk)mk.setLatLng(ll);else mk=L.marker(ll,{icon:icon({name:me.name,logo:me.logo})}).addTo(m);if(zoom)m.setView(ll,17);
        const f=document.getElementById('locf');if(f){f.plat.value=lat.toFixed(6);f.plng.value=lng.toFixed(6)}const s=document.getElementById('pickedTxt');if(s)s.textContent=lat.toFixed(5)+', '+lng.toFixed(5)};
      m.on('click',e=>set(e.latlng.lat,e.latlng.lng,false));PICK[id]=set}
    setTimeout(()=>m.invalidateSize(),60);
  });
}

function ledger(sid){

    ...db.payments.filter(p=>p.shopId===sid).map(p=>({ts:p.ts,k:'p',p,v:p.amount}))].sort((x,y)=>x.ts.localeCompare(y.ts)||(x.k==='o'?-1:1));

}

  let dl=null;try{dl=window.claude?await window.claude.use('downloads'):null}catch(e){}
  if(!dl)dl={save:async({filename,data})=>{const u=URL.createObjectURL(new Blob([data],{type:'application/pdf'}));const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}};
  let box;
  try{
    await loadJs('https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js');
    await loadJs('https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js');
    box=document.createElement('div');box.className='sheet';box.dir=LANG==='en'?'ltr':'rtl';box.innerHTML=html;document.body.appendChild(box);
    try{await document.fonts.ready}catch(e){}
    await Promise.all([...box.querySelectorAll('img')].map(i=>i.decode?i.decode().catch(()=>{}):0));
    const top=box.getBoundingClientRect().top;
    const cuts=[...box.querySelectorAll('tr,.dhead,.dsum,.dtot,.note')].map(el=>el.getBoundingClientRect().bottom-top);
    const scale=2,canvas=await html2canvas(box,{scale,backgroundColor:'#ffffff'});
    const {jsPDF}=window.jspdf,pdf=new jsPDF({unit:'pt',format:'a4'}),PW=595.28,PH=841.89;
    const pxPerPt=box.offsetWidth/PW,pageCss=PH*pxPerPt-24,total=box.offsetHeight;
    let y=0,first=true;
    while(y<total-1){
      let end=Math.min(total,y+pageCss);if(end<total){const c=cuts.filter(v=>v>y+40&&v<=end);if(c.length)end=Math.max(...c)}
      const h=end-y,pc=document.createElement('canvas');pc.width=canvas.width;pc.height=Math.ceil(h*scale);
      const ctx=pc.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,pc.width,pc.height);ctx.drawImage(canvas,0,-y*scale);
      if(!first)pdf.addPage();pdf.addImage(pc.toDataURL('image/jpeg',.92),'JPEG',0,first?0:12,PW,h/pxPerPt);first=false;y=end;
    }
    await dl.save({filename:file,data:pdf.output('arraybuffer')});toast(t('pdfSaved'));
  }catch(e){if(!e||e.code!=='declined')toast(e&&e.code==='unavailable'?t('pdfNo'):t('pdfFail'))}
  finally{if(box)box.remove()}
}
function histModal(sid){const s=shop(sid);docModal(statementHTML(sid),`Statement-${(s.phone||'shop').replace(/\D/g,'')}-${nowTs().slice(0,10)}.pdf`,S.role==='admin')}
function invModal(id){const o=db.orders.find(x=>x.id===id);if(o)docModal(invoiceHTML(o),`Dakhaz-${o.no}-${o.ts.slice(0,10)}.pdf`,S.role==='admin')}

function cartInfo(){let n=0,s=0;for(const[id,q]of Object.entries(S.cart)){const p=prod(id);if(p){n+=q;s+=p.price*q}}return{n,t:s}}
function shopCatalog(){
  const list=filterProducts();const c=cartInfo();
  return toolbar()+`<div class="plist">${list.map(p=>{const q=S.cart[p.id]||0;const out=p.stock<=0;return `<div class="pcard">${pimg(p)}<div class="top"><div><h3 dir="auto">${esc(p.name)}</h3><span class="cat">${catName(p.cat)}</span></div><div class="price num">${money(p.price)}</div></div>
    <div class="note">${out?`<span style="color:var(--bad)">${t('outOf')}</span>`:p.stock<=5?`<span style="color:var(--warn)">${t('onlyLeft',`<span class="num">${p.stock}</span>`)}</span>`:t('available')}</div>
    <div class="qty"><button data-dec="${p.id}" ${q?'':'disabled'} aria-label="-">−</button><b class="num" style="min-width:24px;text-align:center">${q}</b><button data-inc="${p.id}" ${out||q>=p.stock?'disabled':''} aria-label="+">+</button></div></div>`}).join('')||`<div class="empty">${t('none')}</div>`}</div>
  ${c.n?`<div class="cartbar"><b><span class="num">${c.n}</span> ${t('pcs')} · <span class="num">${money(c.t)}</span></b><button class="btn sm" data-t2="cart">${t('viewCart')}</button></div>`:''}`;
}
function shopCart(){
  const items=Object.entries(S.cart).map(([id,q])=>({p:prod(id),q})).filter(x=>x.p);const c=cartInfo();
  if(!items.length)return `<div class="panel"><div class="empty">${t('cartEmpty')}</div></div>`;
  return `<div class="panel"><div class="panel-h">${t('cart')}</div>${items.map(({p,q})=>`<div class="row">${pimg(p,"thumb")}<div class="grow"><span dir="auto">${esc(p.name)}</span><div class="sub num">${money(p.price)} × ${q}</div></div><div class="qty"><button data-dec="${p.id}">−</button><b class="num">${q}</b><button data-inc="${p.id}" ${q>=p.stock?'disabled':''}>+</button></div></div>`).join('')}
  <div class="row"><b class="grow">${t('total')}</b><b class="num" style="font-size:18px">${money(c.t)}</b></div></div>
  <div class="field"><label for="onote">${t('orderNote')}</label><textarea class="inp" id="onote" rows="2" placeholder="${t('notePh')}"></textarea></div>
  <button class="btn pri" id="send">${t('send')}</button>
  <p class="note" style="margin:0">${t('sendNote')}</p>`;
}
function shopAccount(){
  const s=shop(S.shopId),a=acct(S.shopId);
  const prof=`<div class="panel"><div class="panel-h">${t('profile')}</div><div class="pbody">
    <div class="prof">${avatar(s,72)}<div class="grow"><b style="font-size:17px">${esc(s.name)}</b><div class="note num">📱 ${esc(s.phone)}</div>
      <div class="acts" style="margin-top:6px"><label class="btn sm pri" for="logoIn">${t('chooseImg')}</label><input id="logoIn" type="file" accept="image/*" hidden>${s.logo?`<button class="btn sm danger" id="logoDel">${t('removeImg')}</button>`:''}</div></div></div>
  </div></div>
  <form class="panel" id="locf"><div class="panel-h">${t('location')}</div><div class="pbody">
    ${fld('address',t('address'),s.address||'','text',`placeholder="${t('addrPh')}"`)}
    <div class="note">${t('pickHelp')}</div>
    <div class="lmap small" data-lmap="me" data-pick="1" data-name="${esc(s.name)}" data-pts="${esc(JSON.stringify(pinsOf([s])))}"></div>
    <div class="acts"><button type="button" class="btn sm" id="myLoc">${t('myLoc')}</button><span class="note">${t('picked')}: <span class="num" id="pickedTxt">${s.lat!=null?(+s.lat).toFixed(5)+', '+(+s.lng).toFixed(5):'—'}</span></span></div>
    <input type="hidden" name="plat" value="${s.lat??''}"><input type="hidden" name="plng" value="${s.lng??''}">
    ${fld('map',t('mapLink'),s.mapRaw||'','text','dir="ltr" placeholder="https://maps.app.goo.gl/..."')}
    <div class="err" id="locErr"></div>
    <div class="acts"><button class="btn pri" type="submit">${t('saveLoc')}</button>${s.map?`<a class="btn maplink" href="${esc(s.map)}" target="_blank" rel="noopener">${t('openMap')}</a>`:''}</div>
  </div></form>
  ${pwFormHTML()}`;
  return `<div class="stats"><div class="stat"><small>${t('allBuys')}</small><b class="num">${money(a.bought)}</b></div><div class="stat"><small>${t('paidT')}</small><b class="num" style="color:var(--ok)">${money(a.paid)}</b></div><div class="stat hl"><small>${t('debtT')}</small><b class="num">${money(a.rest)}</b></div><div class="stat"><small>${t('orders')}</small><b class="num">${db.orders.filter(o=>o.shopId===s.id).length}</b></div></div>
  <div class="panel"><div class="panel-h">${t('statement')}<button class="btn sm" data-sthist="${s.id}">${t('viewStatement')}</button></div><div class="tscroll">${(()=>{const L=ledger(s.id).slice(-8).reverse();return L.length?`<table class="dt"><tbody>${L.map(e=>`<tr><td class="c"><span class="num">${fmtTs(e.ts)}</span></td><td class="l">${e.k==='o'?`${t('order')} <span class="num">#${e.o.no}</span>`:esc(payNote(e.p))}</td><td class="c ${e.k==='p'?'ok':''}"><span class="num">${e.k==='p'?'− ':'+ '}${money(e.v)}</span></td><td class="c"><span class="num"><b>${money(e.after)}</b></span></td></tr>`).join('')}</tbody></table>`:`<div class="empty">${t('noPays')}</div>`})()}</div></div>`+prof;
}
function renderShop(){
  const s=shop(S.shopId);if(!s){return signOut()}
  const c=cartInfo();const mine=db.orders.filter(o=>o.shopId===s.id);
  const wait=mine.filter(o=>o.status==='handed').length;
  const tabs=[['catalog',t('products')],['cart',t('cart'),c.n||''],['orders',t('myOrders'),wait||''],['account',t('myAccount')]];
  const v={catalog:shopCatalog,cart:shopCart,orders:()=>ordersView(mine,false),account:shopAccount}[S.tab]||shopCatalog;
  shell(s.name,t('appName')+' · '+t('tagline'),tabs,v(),s.logo);
  bindCommon();bindPwForm();
  app.querySelectorAll('[data-inc]').forEach(b=>b.onclick=()=>{const id=b.dataset.inc;S.cart[id]=(S.cart[id]||0)+1;render()});
  app.querySelectorAll('[data-dec]').forEach(b=>b.onclick=()=>{const id=b.dataset.dec;S.cart[id]=(S.cart[id]||0)-1;if(S.cart[id]<=0)delete S.cart[id];render()});
  app.querySelectorAll('[data-t2]').forEach(b=>b.onclick=()=>{S.tab=b.dataset.t2;render();window.scrollTo(0,0)});
  if(window.logoIn)logoIn.onchange=()=>{const f=logoIn.files[0];if(!f)return;resizeImg(f,d=>act('set_logo',{p_logo:d},t('imgSaved')),()=>toast(t('imgBad')))};
  if(window.logoDel)logoDel.onclick=()=>act('set_logo',{p_logo:null});
  if(window.myLoc)myLoc.onclick=()=>{if(!navigator.geolocation){toast(t('locDenied'));return}
    navigator.geolocation.getCurrentPosition(p=>{if(PICK.me)PICK.me(p.coords.latitude,p.coords.longitude,true)},()=>toast(t('locDenied')),{enableHighAccuracy:true,timeout:15000})};
  if(window.locf)locf.onsubmit=async e=>{e.preventDefault();locErr.textContent='';const raw=locf.map.value.trim(),L=parseLoc(raw);
    if(L===null){locErr.textContent=t('badLink');return}
    let lat=locf.plat.value!==''?+locf.plat.value:L.lat,lng=locf.plng.value!==''?+locf.plng.value:L.lng;
    if(L.lat!=null&&raw!==(s.mapRaw||'')){lat=L.lat;lng=L.lng}
    const url=L.map&&/^https:/.test(L.map)&&!/[?&]q=-?\d/.test(L.map)?L.map:(lat!=null?`https://www.google.com/maps?q=${lat},${lng}`:'');
    try{await api('update_profile',{p_token:TOKEN,p_address:locf.address.value,p_map_raw:raw,p_map_url:url,p_lat:lat,p_lng:lng});await refresh(true);toast(t('locSaved'))}catch(err){locErr.textContent=errMsg(err)}};
  app.querySelectorAll('[data-recv]').forEach(b=>b.onclick=()=>{const o=db.orders.find(x=>x.id===b.dataset.recv);if(!o||o.status!=='handed')return;
    modal(t('needConfirm')+` <span class="num">#${o.no}</span>`,`<div class="dtot"><div><span>${t('thisOrder')}</span><b class="num">${money(o.total)}</b></div><div><span>${t('driverSays')}</span><b class="num ok">${money(+o.paidClaim||0)}</b></div><div class="grand"><span>${t('remainOrder')}</span><b class="num">${money(Math.max(0,o.total-(+o.paidClaim||0)))}</b></div></div>`,t('shopConfirm'),
      async()=>{await call('confirm_received',{p_id:o.id});toast(t('receivedT'))})});
  if(window.send)send.onclick=async()=>{send.disabled=true;
    const items=Object.entries(S.cart).map(([pid,qty])=>({pid,qty}));
    try{await api('place_order',{p_token:TOKEN,p_items:items,p_note:onote.value});S.cart={};S.tab='orders';S.of='all';await refresh(true);toast(t('sent'))}
    catch(err){toast(errMsg(err));refresh(true).catch(()=>{})}finally{if(window.send)send.disabled=false}};
}
function bindCommon(){
  const q=document.getElementById('q');
  if(q)q.oninput=()=>{S.q=q.value;const pos=q.selectionStart;render();const n=document.getElementById('q');n.focus();n.setSelectionRange(pos,pos)};
  app.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{S.cat=b.dataset.c;render()});
  app.querySelectorAll('[data-zoomimg]').forEach(im=>im.onclick=()=>{const p=prod(im.dataset.zoomimg);if(!p||!p.img)return;const ov=document.createElement('div');ov.className='ov imgv';ov.innerHTML=`<figure><img src="${p.img}" alt=""><figcaption dir="auto">${esc(p.name)} · <span class="num">${money(p.price)}</span></figcaption></figure>`;ov.onclick=()=>ov.remove();document.body.appendChild(ov)});
  app.querySelectorAll('[data-inv]').forEach(b=>b.onclick=()=>invModal(b.dataset.inv));
  app.querySelectorAll('[data-sthist]').forEach(b=>b.onclick=()=>histModal(b.dataset.sthist));
  app.querySelectorAll('[data-of]').forEach(b=>b.onclick=()=>{S.of=b.dataset.of;render()});
}
function render(){
  document.documentElement.lang=LANG==='ku'?'ckb':LANG; document.documentElement.dir=LANG==='en'?'ltr':'rtl';
  if(!CONFIGURED){app.innerHTML=`<div class="wrap login"><div class="lcard"><div class="logo-box"><img src="${IMG.ku}" alt="Dakhaz Parts"></div><div class="lock">${t('setupNeeded')}</div></div></div>`;return}
  if(!S.role){if(TOKEN&&!booted){app.innerHTML=`<div class="wrap login"><div class="lcard"><div class="logo-box"><img src="${IMG.ku}" alt="Dakhaz Parts"></div><div class="empty">${t('loading')}</div></div></div>`;return}return renderLogin()}
  S.role==='admin'?renderAdmin():S.role==='driver'?renderDriver():renderShop();
  initMaps();
}
async function googleReturn(){
  const h=new URLSearchParams(location.hash.slice(1));
  if(!h.get('access_token')&&!h.get('error'))return false;
  history.replaceState(null,'',location.pathname+location.search);
  S.loginAs='admin';
  if(h.get('error')){S.loginErr=t('googleFail');return true}
  try{const r=await api('google_login',{},h.get('access_token'));TOKEN=r.token;try{localStorage.setItem(TKEY,TOKEN)}catch(x){}}
  catch(e){S.loginErr=errMsg(e)}
  return true;
}
render();
if(CONFIGURED)googleReturn().then(g=>{if(TOKEN)return refresh(true);if(g)render()}).catch(e=>{TOKEN=null;try{localStorage.removeItem(TKEY)}catch(x){}render();const l=document.getElementById('lerr');if(l)l.textContent=errMsg(e)});
</script>
